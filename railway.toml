# The service Railway deploys: the .NET API with the React client baked in.
# Settings live in api-dotnet/railway.toml; this file points at the same image
# because Railway reads the repo-root config unless the service overrides it.

[build]
builder = "DOCKERFILE"
dockerfilePath = "api-dotnet/Dockerfile"
# Paths whose changes trigger a deploy. The dashboard still held "/server/**"
# from the Express service, so every push since the cutover was skipped with
# "No changes to watched files". Set here, it overrides the dashboard value.
watchPatterns = ["/api-dotnet/**", "/client/**", "/core/**", "/package.json", "/bun.lock", "/railway.toml"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
